<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Simple Add-on Popup</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; }
      button { padding: 8px 12px; }
      pre { background:#f3f3f3; padding:8px; overflow:auto }
    </style>
  </head>
  <body>
    <div>
      <div style="margin-top:8px">City: <span id="city">Not set</span></div>
      <div style="margin-top:4px">District: <span id="district">Not set</span></div>
      <div style="margin-top:4px">Street: <span id="street">Not set</span></div>
      <div style="margin-top:4px">AdaNo: <span id="adaNo">Not set</span></div>
      <div style="margin-top:4px">ParselNo: <span id="parselNo">Not set</span></div>
      <div style="margin-top:6px">TapuAlani: <span id="tapuAlani">Not set</span></div>
      <div style="margin-top:4px">Nitelik: <span id="nitelik">Not set</span></div>
      <div style="margin-top:6px">TKGM status: <span id="tkgm-status">Not started</span></div>
      <div style="margin-top:6px; font-weight:bold;">Daily Queries: <span id="daily-count">0/70</span></div>
      <div style="margin-top:12px; font-size:12px; text-align:center; color:#555;">
        Developed by <a href="https://github.com/pirik3/sahibinden-tkgm-arsa-sorgu" target="_blank" style="color:#0066cc; text-decoration:none;">pirik3</a>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
